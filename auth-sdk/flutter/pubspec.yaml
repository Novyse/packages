name: novyse_auth
description: Flutter client for the Novyse authentication service.
version: 1.0.0
repository: https://github.com/novyse/auth-sdk
issue_tracker: https://github.com/novyse/auth-sdk/issues
topics:
  - authentication
  - opaque
  - jwt

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_opaque:
    path: ./flutter_opaque

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
